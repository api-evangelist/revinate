apis:
- aid: revinate:porter
  name: Revinate Porter API
  description: 'The Porter API is Revinate''s structured review-data REST API. It provides
    read access to hotel reviews aggregated across more than 100 review sites, plus key metrics
    (review counts, average ratings, TripAdvisor rank) and hospitality-tuned sentiment analysis.
    Two review streams exist and are not interchangeable: the Review Stream is licensed for
    offline analysis only and may not be used for display, while the Widget Review Stream is
    licensed for display and republishing but excludes TripAdvisor and Yelp content. All 22
    operations are GET; the API is read-only. Authentication is a four-header HMAC-SHA256
    scheme keyed on an API secret issued by Revinate.'
