aid: revinate
name: Revinate
description: 'Revinate is a hospitality technology company providing a Guest Data Platform
  and CRM for hotels — unifying guest profiles from property-management systems, then driving
  direct revenue through email marketing, a voice/call-center product, a virtual concierge, and
  reputation and guest-feedback management. Revinate states it powers 950 million-plus guest
  profiles and $17.2 billion in direct revenue for over 12,500 hotels worldwide. Its public
  developer surface is the Porter API — a read-only REST API for structured review data covering
  100-plus review sites, exposing hotels, hotel sets, reviews, competitor reviews, review-volume
  and rating snapshots, survey email statistics, and hospitality-specific sentiment analysis
  broken out by topic category.'
