source: openapi/revinate-porter-openapi.yml
origin_contract: https://porter.revinate.com/api-docs
api: Revinate Porter API
note: >-
  Entity-relationship graph derived from the 35 schemas in the converted OpenAPI, which in turn come
  from the six Swagger 1.2 resource declarations Revinate publishes. Relationships are read from
  $ref links between models and from id-reference fields. Revinate publishes no object reference
  page, so field semantics below come from the contract's own property names and descriptions.
identifiers:
  style: opaque path identifiers
  note: >-
    Ids appear only as path parameters (hotelId, hotelSetId, reviewId, languageId, reviewSiteId) and
    are not exposed as properties on the representation models — the models are HAL-style and carry
    a `links` array instead. An agent must therefore harvest ids from collection `links`, not from a
    top-level id field. Human-facing `slug` fields exist on Hotel, ReviewSite and Language and are
    the stable, readable handles.
  path_parameters:
  - hotelId
  - hotelSetId
  - reviewId
  - languageId
  - reviewSiteId
  slug_bearing_entities:
  - HotelRep
  - ReviewSiteRep
  - LanguageRep
entities:
- name: HotelSetRep
  label: Hotel Set
  description: A grouping of hotels, typically a corporate portfolio or brand collection.
  key_fields: [name, corporateHotel, type]
  root_operations: [listHotelSets, getHotelSet]
- name: HotelRep
  label: Hotel
  description: A single property, with address, branding and external identifiers.
  key_fields: [name, slug, logo, url, address1, city, state, postalCode, country, tripAdvisorId, accountType]
  external_identifiers: [tripAdvisorId]
  root_operations: [listHotels, getHotel]
- name: ReviewRep
  label: Review
  description: A single guest review or survey response, aggregated from a review site or Revinate's own survey.
  key_fields: [title, body, author, authorLocation, dateReview, dateCollected, updatedAt, rating, nps, tripType, crawledUrl, subratings]
  root_operations: [listReviews, getReview, listWidgetReviews]
- name: ReviewSiteRep
  label: Review Site
  description: One of the 100-plus external sources Revinate aggregates reviews from.
  key_fields: [name, mainUrl, slug]
  root_operations: [listReviewSites, getReviewSite]
- name: LanguageRep
  label: Language
  description: A language a review may be written in; slug values feed the languageSlug filter.
  key_fields: [name, englishName, slug]
  root_operations: [listLanguages, getLanguage]
- name: ResponseRep
  label: Management Response
  description: The hotel's published reply to a review.
  key_fields: [body, author, date]
  root_operations: []
- name: SurveyGuestStayRep
  label: Guest Stay
  description: Reservation and stay context attached to a survey-sourced review.
  key_fields: [checkinDate, checkoutDate, loyaltyId, confirmationCode, bookingChannel, roomType, roomNumber, rate, rateCurrency, ratePlanCode, groupName]
  root_operations: []
- name: SurveyGuestRep
  label: Guest
  description: The identified guest behind a survey response.
  key_fields: [title, firstName, lastName, phone, email, address, city, state, country, postalCode]
  pii: true
  root_operations: []
- name: SurveyTopicRep
  label: Survey Topic
  description: A themed block of survey questions and the guest's answers.
  key_fields: [name]
  root_operations: []
- name: QuestionRep
  label: Survey Question
  description: A survey question definition, including its answer type and option configuration.
  key_fields: [name, type]
  root_operations: []
- name: QuestionAnswerRep
  label: Survey Answer
  description: A guest's answer, polymorphic across yes/no, text, rating, range and multiple-choice.
  key_fields: [yesNoAnswer, textAnswer, ratingAnswer, rangeAnswer, multipleChoiceAnswers, notApplicableAnswer]
  root_operations: []
- name: ReviewsSnapshotRep
  label: Reviews Snapshot
  description: Aggregate review metrics for a hotel, broken out by review site and over time.
  key_fields: [aggregateValues, valuesByReviewSite, valuesByTime]
  root_operations: [getReviewsSnapshotByHotelId]
- name: TopicCategoriesSnapshotRep
  label: Sentiment Category Snapshot
  description: Category-level sentiment analysis for a hotel.
  key_fields: [topicCategories]
  root_operations: [getSentimentSnapshotByHotelId]
- name: TopicsSnapshotRep
  label: Sentiment Topic Snapshot
  description: Child-topic-level sentiment analysis for a hotel.
  key_fields: [topics]
  root_operations: [getSentimentBreakdownByHotelIdAndTopicCategoryId]
- name: TopicStatisticsRep
  label: Topic Statistics
  description: Sentiment score and mention counts for one operational topic.
  key_fields: [topicCategoryId, text, score, scorePercentChange, mentionCount, positiveMentionCount, neutralMentionCount, negativeMentionCount]
  root_operations: []
- name: SurveyEmailStatsRep
  label: Survey Email Statistics
  description: Email delivery and engagement counters for a hotel's guest surveys.
  key_fields: [requests, sent, delivered, bounces, bounceDrops, invalidEmails, spamReports, unsubscribes, uniqueOpens, uniqueClicks, uniqueViews]
  root_operations: [getSurveyEmailStatsByHotelId]
