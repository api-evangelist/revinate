pii_surface:
  present: true
  entities:
  - SurveyGuestRep
  - SurveyGuestStayRep
  fields:
  - firstName
  - lastName
  - email
  - phone
  - address
  - address2
  - city
  - state
  - country
  - postalCode
  - loyaltyId
  - confirmationCode
  note: >-
    Survey-sourced reviews carry identified guest data — full name, email, phone, postal address,
    loyalty id and booking confirmation code. Any integration reading /reviews on a survey-enabled
    property is handling personal data and falls in scope for GDPR/CCPA obligations. This is a
    schema-shape observation from the public contract; no personal data was retrieved.
wrapper_models:
  note: >-
    Collections are wrapped in Spring HATEOAS PagedResources/Collection envelopes with a Link model,
    so the payload shape is {_embedded-style collection, links[], page{}} rather than a bare array.
  models:
  - PagedResources_HotelRep
  - PagedResources_HotelSetRep
  - PagedResources_ReviewRep
  - PagedResources_ReviewSiteRep
  - PagedResources_LanguageRep
  - PageMetadata
  - Link
