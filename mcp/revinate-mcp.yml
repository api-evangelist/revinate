agent_guidance:
  - >-
    The display licence is the single most important rule on this API. Reviews from list_reviews and
    its siblings may be used for offline analysis ONLY and must never be surfaced to an end user.
    Anything shown to a person must come from list_widget_reviews or get_widget_reviews_for_hotel.
  - All 22 tools are read-only. No tool in this surface can mutate Revinate state.
  - >-
    Survey-sourced reviews embed identified guest PII (name, email, phone, postal address, loyalty id,
    confirmation code). Treat review payloads as personal data.
