  description: List hotels the API key has access to.
- name: get_hotel
  rest: getHotel
  description: Get a single hotel by id.
- name: list_hotel_sets
  rest: listHotelSets
  description: List hotel sets (corporate or brand groupings of properties).
- name: get_hotel_set
  rest: getHotelSet
  description: Get a single hotel set by id.
