openapi: 3.1.0
info:
  title: Revinate Porter API
  version: '1.0'
  description: 'Revinate''s structured review data API. Provides access to hotel reviews across 100+ review sites,
    with key metrics (review counts, average ratings), sentiment analysis, competitor review streams and survey
    email statistics.


    Two review streams exist and they are not interchangeable: the Review Stream (/reviews, /hotels/{hotelId}/reviews)
    is for offline analysis and its content may NOT be used for display, while the Widget Review Stream (/widgetreviews)
    is licensed for display/republishing but excludes TripAdvisor and Yelp content under content-licensing agreements
    with those partners.


    CONVERSION NOTE: Revinate publishes this contract as Swagger 1.2 at https://porter.revinate.com/api-docs. This
    OpenAPI 3.1.0 document is a faithful mechanical conversion of the six published Swagger 1.2 resource declarations
    by API Evangelist; the verbatim originals are preserved in openapi/_original/. Operation IDs were made unique
    (the published nickname "get" is reused across all six resources).'
  contact:
    name: Revinate Support
    email: support@revinate.com
    url: https://www.revinate.com/support/
  license:
    name: Revinate API License
    url: https://www.revinate.com/website-terms-of-use/
servers:
- url: https://porter.revinate.com
  description: Revinate Porter API production base URL
tags:
- name: Hotel Sets
- name: Hotels
- name: Languages
- name: Review Sites
- name: Reviews
- name: Widget Reviews
paths:
  /hotelsets:
    get:
      tags:
      - Hotel Sets
      summary: Get Hotel Sets
      description: Returns a collection of hotel sets. Hotel sets are only available for corporate or group customers.
        A hotel set is a subset of the properties belonging to the group and configurable in the Revinate Reputation
        application. Pagination is supported by this resource.
      operationId: listHotelSets
      parameters:
      - name: page
        in: query
        required: false
        description: page number
        schema:
          type: integer
          description: page number
      - name: size
        in: query
        required: false
        description: number of elements to show per page
        schema:
          type: integer
          description: number of elements to show per page
      - name: sort
        in: query
        required: false
        description: sort field and direction (eg. ?sort=name,ASC)
        schema:
          type: string
          description: sort field and direction (eg. ?sort=name,ASC)
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - porterUsername: []
        porterTimestamp: []
        porterKey: []
        porterEncoded: []
  /hotelsets/{hotelSetId}:
