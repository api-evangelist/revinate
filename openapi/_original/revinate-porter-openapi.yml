          type: string
        url:
          type: string
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string
        tripAdvisorId:
          type: integer
          format: int64
        revinatePurchaseUri:
          type: string
        revinateLoginUri:
          type: string
        accountType:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
    HotelSetRep:
      type: object
      properties:
        name:
          type: string
        corporateHotel:
          $ref: '#/components/schemas/HotelRep'
        type:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
    LanguageRep:
      type: object
