note: >-
  Revinate publishes NO client SDK for the Porter API in any language. The documentation ships
  inline HMAC-signing snippets for Shell, Java, Ruby and C# instead of a library. What Revinate does
  publish to a package registry is a set of first-party engineering libraries under the com.revinate
  Maven Central group, none of which wraps the Porter REST API. The newest of them was published on
  2018-11-27 — nearly eight years before this probe — which is recorded here as a decay signal, not
  as SDK coverage. Because no package targets the API being profiled, no `SDKs` pointer is emitted:
  asserting one would credit Revinate with client-library coverage for an API that has none.
