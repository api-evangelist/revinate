note: >-
  Revinate documents no rate limits for the Porter API — no requests-per-second or per-day figure,
  no burst allowance, no rate-limit response headers, and no status code on exhaustion. The
  documentation page has no rate-limiting section at all. Recorded as limit_count 0 with evidence
  rather than omitted. Two adjacent constraints ARE documented and are captured below because they
  bound throughput in practice even though they are not rate limits in the conventional sense.
