  note: >-
    No X-RateLimit-*, RateLimit-* or Retry-After header is documented, and none was observed on live
    unauthenticated responses from https://porter.revinate.com/ on 2026-08-26. An agent has no
    runtime signal telling it how much budget remains or how long to wait, so the only safe strategy
    is conservative fixed-rate pacing with exponential backoff on any non-2xx.
